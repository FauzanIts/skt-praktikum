# terima koneksi dari host lain di port 1883
listener 1883
# praktikum ini belum memakai username/password (dibahas di Modul 5)
allow_anonymous true

# ---------------------------------------------------------------------------
# [PENYIMPANGAN SADAR DARI MODUL]
# Modul (Kode 2.37) hanya memuat dua baris di atas. Namun berkas bawaan image
# eclipse-mosquitto:2 sebenarnya sudah memuat "persistence true"; karena kita
# MENIMPA seluruh konfigurasi itu, persistence ke disk ikut hilang dan sesi
# hanya hidup di memori broker.
#
# Akibatnya: sesi persisten (C.12) tetap berhasil dengan "docker compose stop
# cloud-api", TETAPI akan hilang bila broker ikut dibuat ulang memakai
# "docker compose down" -- gejalanya session_present=False tanpa sebab jelas.
# Dua baris di bawah membuat sesi selamat walau broker ikut restart.
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
